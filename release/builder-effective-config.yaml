directories:
  output: release
  buildResources: build
appId: com.honey.mate
productName: Honey
publish:
  - provider: github
    owner: Gftdjhnsnyli
    repo: HoneyAI
extraResources:
  - filter:
      - assets/**/*
files:
  - filter:
      - out/**/*
      - package.json
win:
  signAndEditExecutable: false
  icon: build/honey.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Honey
electronVersion: 33.4.11
